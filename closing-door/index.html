<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>닫히는 문 — 1960~1987</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 무게 있는 회고, 신문사 편집국의 밤
   IDEA: 1960~70년대 신문 지면과 낡은 나무 문
   PICTURE: 장면 무대 + 점점 닫히는 문 게이지
   COLOUR and TYPE: 바랜 신문지, 먹색, 벽돌 적색, 올리브 / 도현(제목), 본고딕 Noto Sans KR(본문)
   LAYOUT: 상단 상태줄, 16:9 무대, 아래 대사창 — 600px 이하에서 세로로 쌓기 */
:root{color-scheme:light dark;
--bg:light-dark(#d9ccb0,#14110d);--paper:light-dark(#f1e7d0,#231d16);--paper2:light-dark(#e6d8b9,#2c251c);
--ink:light-dark(#2b231b,#ece1cb);--muted:light-dark(#6b5c49,#b3a58c);--brick:light-dark(#9e3b2b,#e07a62);
--olive:light-dark(#56633a,#a9b878);--navy:light-dark(#2e3d55,#9fb3d4);--wood:#6e4527;--line:light-dark(#b8a684,#4a3f31)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.7 "Noto Sans KR",sans-serif;overflow-x:clip}
button,select,textarea,input{font:inherit;color:inherit}
.h{font-family:"Do Hyeon",sans-serif;font-weight:400;letter-spacing:0}
.wrap{max-width:1080px;margin:0 auto;padding:12px max(2vw,10px) 40px}
.btn{font-family:"Do Hyeon",sans-serif;font-size:18px;min-height:44px;padding:8px 18px;border:2px solid var(--ink);background:var(--paper);border-radius:4px;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.btn:hover{background:var(--paper2)}.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.pri{background:var(--brick);color:#fff8ec;border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{font-size:15px;min-height:36px;padding:4px 12px;box-shadow:2px 2px 0 var(--ink)}
:focus-visible{outline:3px solid var(--brick);outline-offset:2px}
/* 상단 */
#hud{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 12px;background:var(--paper);border:2px solid var(--ink);border-radius:4px;margin-bottom:10px}
#hud .doorMini{width:38px;height:48px}
#hud .chap{flex:1 1 200px}
#hud .chap b{display:block;font-size:20px;line-height:1.1}
#hud .chap span{font-size:14px;color:var(--muted)}
.stat{font-family:"Do Hyeon";font-size:16px;padding:4px 10px;border:1px solid var(--line);border-radius:3px;white-space:nowrap}
/* 무대 */
#stage{position:relative;aspect-ratio:16/9;border:2px solid var(--ink);border-radius:4px;overflow:hidden;background:#333}
.bg{position:absolute;inset:0}
.bg .fb{position:absolute;inset:0;align-items:flex-end;justify-content:center;font-size:clamp(40px,9vw,96px);letter-spacing:.2em;padding-bottom:16%;opacity:.85}
.bg .cap{position:absolute;left:12px;top:10px;font-family:"Do Hyeon";font-size:15px;background:rgba(20,15,10,.7);color:#f1e7d0;padding:3px 10px;border-radius:3px}
.pic{position:relative;display:block;width:100%;height:100%}
.pic img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated;display:block}
.pic.contain img{object-fit:contain;object-position:center bottom}
.pic .fb{display:none}.pic.nf .fb{display:flex}
#portrait{position:absolute;left:2%;bottom:0;width:24%;aspect-ratio:1/1.15;transition:opacity .3s}
.fbp{position:absolute;inset:8% 6% 0;border-radius:50% 50% 8px 8px;background:var(--c);border:3px solid #1a140e;align-items:center;justify-content:center;flex-direction:column;box-shadow:inset -10px -10px 0 rgba(0,0,0,.18)}
.fbp .f{font-size:clamp(34px,7vw,70px);line-height:1}.fbp .acc{position:absolute;right:-4%;bottom:6%;font-size:clamp(20px,3.5vw,36px)}
/* 대사창 */
#dlg{position:relative;margin-top:10px;background:var(--paper);border:3px solid var(--wood);border-radius:4px;padding:16px 18px 14px;min-height:150px;box-shadow:inset 0 0 0 2px var(--paper2),4px 4px 0 rgba(0,0,0,.25)}
#dlg .name{position:absolute;top:-16px;left:14px;font-family:"Do Hyeon";font-size:17px;padding:2px 12px;background:var(--c,var(--navy));color:#fff8ec;border:2px solid var(--ink);border-radius:3px}
#dlg .txt{font-size:19px;font-weight:500;line-height:1.75;min-height:3.3em;max-width:66ch}
#dlg .txt.nar{color:var(--muted);font-weight:400}
#dlg .row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:10px}
.opts{display:grid;gap:8px;margin-top:8px}
.opt{text-align:left;font-size:17px;min-height:44px;padding:8px 14px;border:2px solid var(--line);background:var(--paper2);border-radius:4px;cursor:pointer}
.opt:hover{border-color:var(--ink)}.opt.sel{border-color:var(--brick);background:color-mix(in srgb,var(--brick) 14%,var(--paper))}
.reply{margin-top:10px;padding:10px 14px;border-left:4px solid var(--olive);background:var(--paper2)}
/* 패널(미니게임·기사) */
#panel{background:var(--paper);border:2px solid var(--ink);border-radius:4px;padding:clamp(14px,3vw,28px)}
#panel h2{font-family:"Do Hyeon";font-weight:400;font-size:clamp(26px,4vw,36px);line-height:1.1;margin:0 0 4px;text-wrap:balance}
#panel .lead{color:var(--muted);margin:0 0 16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:10px;border:2px dashed var(--line);border-radius:4px;margin-bottom:14px}
.chip{font-size:16px;min-height:44px;padding:6px 12px;border:2px solid var(--ink);background:#fffaf0;color:#2b231b;border-radius:3px;cursor:pointer;text-align:left;max-width:100%}
.chip.sel{background:var(--brick);color:#fff;box-shadow:0 0 0 3px color-mix(in srgb,var(--brick) 35%,transparent)}
.chip.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.bin{border:2px solid var(--ink);border-radius:4px;background:var(--paper2);padding:10px;min-height:120px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;align-items:stretch}
.bin>b{font-family:"Do Hyeon";font-weight:400;font-size:19px}
.bin small{color:var(--muted);font-size:14px}
.bin .in{font-size:15px;padding:4px 8px;background:var(--paper);border-left:3px solid var(--olive)}
.bin:hover{outline:2px solid var(--brick)}
.msg{min-height:1.6em;margin:10px 0;font-weight:700}
.msg.ok{color:var(--olive)}.msg.no{color:var(--brick)}
.ans{color:var(--brick);font-family:"Do Hyeon";font-size:14px;margin-left:4px}
/* 기사 */
.heads{display:grid;gap:10px}
.head{font-family:"Do Hyeon";font-size:clamp(19px,2.6vw,24px);line-height:1.25;text-align:left;padding:12px 16px;border:2px solid var(--ink);background:#fbf4e2;color:#211a12;border-radius:2px;cursor:pointer}
.head.sel{outline:4px solid var(--brick)}
.head.good{background:#e3ecd2}.head.bad{background:#f3d9d0}
.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:10px}
.card{position:relative;text-align:left;padding:12px 12px 10px;border:2px solid #3a2e22;background:#f7eed8;color:#2b231b;border-radius:3px;font-size:15px;line-height:1.5;cursor:default}
button.card{cursor:pointer}
.card .ty{display:inline-block;font-family:"Do Hyeon";font-size:13px;padding:1px 8px;color:#fff;border-radius:2px;margin-bottom:4px}
.card b{display:block;font-family:"Do Hyeon";font-weight:400;font-size:18px;line-height:1.2;margin-bottom:4px}
.card.sel{outline:4px solid var(--brick)}
.card.locked{opacity:.35;filter:grayscale(1)}
.card .src{display:block;margin-top:6px;font-size:13px;color:#6b5c49}
.ty.조문{background:#2e3d55}.ty.통계{background:#56633a}.ty.구호{background:#9e3b2b}.ty.사료{background:#6e4527}.ty.기록{background:#4b4b4b}.ty.헤드라인{background:#7a5a1e}
/* 오버레이 */
#ov{position:fixed;inset:0;background:rgba(15,11,7,.78);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
#ov.on{display:flex}
#ov .box{background:var(--paper);border:3px solid var(--ink);border-radius:4px;padding:20px;max-width:min(860px,100%);max-height:90vh;overflow:auto;text-align:center}
#ov .box.wide{text-align:left;width:100%}
.bigdoor{width:min(240px,60vw);height:min(300px,75vw);margin:6px auto 10px}
.bigdoor .pic{animation:fade .8s}
@keyframes fade{from{opacity:0;transform:scale(.97)}}
.slam{animation:slam .5s}
@keyframes slam{30%{transform:translateX(-5px)}60%{transform:translateX(5px)}}
.toastcard{max-width:360px;margin:10px auto}
/* 표지 */
.cover{background:var(--paper);border:2px solid var(--ink);border-radius:4px;overflow:hidden}
.cover .art{position:relative;aspect-ratio:16/9;background:linear-gradient(90deg,#2a2f3a 0 30%,#8a6a3c 50%,#2a2f3a 70%)}
.cover .art .fb{position:absolute;inset:0;align-items:center;justify-content:center}
.cover .ttl{padding:20px clamp(16px,4vw,36px) 26px}
.cover h1{font-family:"Do Hyeon";font-weight:400;font-size:clamp(40px,7vw,64px);line-height:1.05;margin:0}
.cover p{margin:6px 0 16px;color:var(--muted)}
.field{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.field input{font-size:16px;min-height:44px;padding:6px 10px;border:2px solid var(--ink);background:#fffaf0;color:#2b231b;border-radius:3px;flex:1 1 160px}
.toggle{display:flex;align-items:center;gap:8px;font-size:15px;min-height:44px}
.toggle input{width:20px;height:20px}
.chs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px;margin-top:10px}
.ch{text-align:left;padding:14px;border:2px solid var(--ink);background:var(--paper2);border-radius:4px;cursor:pointer}
.ch b{font-family:"Do Hyeon";font-weight:400;font-size:20px;display:block}
.ch span{font-size:14px;color:var(--muted)}
table.cmp{width:100%;border-collapse:collapse;font-size:15px;margin-top:10px}
table.cmp th,table.cmp td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.cmp th{font-family:"Do Hyeon";font-weight:400;background:var(--paper2)}
textarea{width:100%;min-height:110px;font-size:16px;padding:10px;border:2px solid var(--ink);border-radius:3px;background:#fffaf0;color:#2b231b}
select{font-size:16px;min-height:44px;padding:4px 8px;border:2px solid var(--ink);border-radius:3px;background:#fffaf0;color:#2b231b;width:100%}
.m2row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) minmax(0,1.4fr);gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.m2row b{font-family:"Do Hyeon";font-weight:400;font-size:19px}
.redline{background:linear-gradient(transparent 45%,#c0281c 45% 58%,transparent 58%)}
.result{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:10px;margin:14px 0}
.result div{border:2px solid var(--ink);padding:12px;background:var(--paper2);text-align:center}
.result b{display:block;font-family:"Do Hyeon";font-weight:400;font-size:clamp(28px,5vw,40px);line-height:1.1}
.endline{font-family:"Do Hyeon";font-size:clamp(24px,4vw,34px);line-height:1.25;text-align:center;margin:10px 0;text-wrap:balance}
.note{font-size:13px;color:var(--muted)}
.hidden{display:none!important}
.exbox{margin:8px 0 10px;padding:12px 16px;border:2px dashed var(--olive);border-radius:4px;background:color-mix(in srgb,var(--olive) 8%,var(--paper))}
.exbox b{font-family:"Do Hyeon";font-weight:400;font-size:18px}
.exbox ol{margin:6px 0 8px;padding-left:1.3em}.exbox li{margin:2px 0}
.exbox q{display:block;quotes:none;padding:8px 12px;background:var(--paper);border-left:4px solid var(--olive);font-size:16px}
.exbox .note{margin:6px 0 0}
.dstages{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:8px}
.dst{display:grid;gap:2px;padding:8px;border:2px solid var(--line);border-radius:4px;background:var(--paper2);font-size:14px;line-height:1.35}
.dst.now{border-color:var(--brick);box-shadow:0 0 0 2px color-mix(in srgb,var(--brick) 30%,transparent)}
.dst .dimg{display:block;height:72px}.dst b{font-family:"Do Hyeon";font-weight:400;font-size:18px}.dst small{color:var(--muted)}
.desk{margin-top:6px;padding:12px 16px;background:var(--paper2);border:2px solid var(--wood);border-radius:4px;font-size:17px}.desk b{font-family:"Do Hyeon";font-weight:400;margin-right:6px}
.why{font-family:"Noto Sans KR",sans-serif;font-size:15px;margin-top:4px}
.card.cok{outline:3px solid #56633a}.card.cno{outline:3px solid #9e3b2b;opacity:.85}
.mtab{border:2px solid var(--ink);border-radius:4px;overflow:hidden}
.mhead,.mrow{display:grid;grid-template-columns:minmax(0,1fr) 96px 96px;gap:8px;align-items:center;padding:8px 10px}
.mhead{background:var(--paper2);font-size:14px}.mhead b{font-family:"Do Hyeon";font-weight:400;text-align:center;line-height:1.2}
.mgroup{font-family:"Do Hyeon";font-size:18px;padding:6px 10px;background:var(--ink);color:var(--paper)}
.mrow{border-top:1px solid var(--line)}.mrow.ok{background:color-mix(in srgb,#56633a 14%,transparent)}.mrow.no{background:color-mix(in srgb,#9e3b2b 14%,transparent)}
.tog{justify-self:center;width:44px;height:44px;border:2px solid var(--ink);border-radius:4px;background:#fffaf0;color:#2b231b;font-size:22px;cursor:pointer}.tog.on{background:var(--olive);color:#fff}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.done{font-size:14px;color:var(--olive);margin-left:6px}
.tpanel{margin-top:18px;padding:14px;border:2px dashed var(--brick);border-radius:4px}
.qbox{font-size:18px;font-weight:500;padding:12px 16px;border-left:5px solid var(--brick);background:var(--paper2);margin:6px 0 12px}
.mylog{list-style:none;padding:0;margin:0;display:grid;gap:6px}.mylog li{display:grid;gap:2px;padding:8px 12px;background:var(--paper2);border-radius:3px}.mylog span{font-size:14px;color:var(--muted)}
@media(max-width:600px){
 .mhead,.mrow{grid-template-columns:minmax(0,1fr) 64px 64px}
 .mhead b{font-size:13px}
 #portrait{width:30%}
 .m2row{grid-template-columns:1fr}
 #dlg .txt{font-size:17px}
 #hud .chap b{font-size:18px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div id="hud" class="hidden">
    <button class="doorMini" id="doorMini" aria-label="닫히는 문 설명 보기" style="border:0;padding:0;background:none;cursor:pointer"></button>
    <div class="chap"><b id="chT"></b><span id="chY"></span></div>
    <span class="stat" id="stCred">신뢰도 —</span>
    <span class="stat" id="stCard">사료 0</span>
    <button class="btn sm" id="bArchive">🗂️ 사료함</button>
    <button class="btn sm hidden" id="bSkip">⏭ 다음 활동으로</button>
    <button class="btn sm" id="bSnd" aria-label="소리 설정 바꾸기"></button>
    <button class="btn sm" id="bHome">처음으로</button>
  </div>
  <div id="main"></div>
</div>
<div id="ov"><div class="box" id="ovBox"></div></div>

<script>
{
/* ============ 데이터 ============ */
const BG={
B1:{n:'1960년 봄, 서울 거리',g:'linear-gradient(#f3c9c9,#e7d9b0 55%,#a88b62)',e:'🌸🧑‍🎓🚋🧑‍🎓🌸'},
B2:{n:'국회 의사당',g:'linear-gradient(#5b4632,#8a6a45 50%,#3f2f20)',e:'🪑🎙️🪑'},
B3:{n:'새벽일보 편집국',g:'linear-gradient(#4a3b2a,#9b7d55 60%,#5a4530)',e:'📰⌨️☎️💡'},
B4:{n:'1961년 5월 16일 새벽',g:'linear-gradient(#5f6f80,#8c9aa6 60%,#3c4650)',e:'🌫️🚛🪖🚛'},
B5:{n:'1964년 6월, 대학 교문 앞',g:'linear-gradient(#8f9396,#b9b2a0 60%,#5f5a50)',e:'✊🧑‍🎓💨🛡️'},
B6:{n:'1960년대 부산항',g:'linear-gradient(#e7b98a,#8fa7b3 55%,#3e5566)',e:'🚢🪖👋'},
B7:{n:'봉제 공장 다락방',g:'linear-gradient(#3a2c1f,#6b5236 60%,#2a1f15)',e:'🧵🪡💡🧵'},
B10:{n:'1972년 10월 17일 밤, 서울',g:'linear-gradient(#1c2638,#34445e 60%,#151b26)',e:'🌙🪖🚧🛻'},
B11:{n:'1979년 8월, 신민당사',g:'linear-gradient(#6b6258,#9d8f7c 60%,#4b433a)',e:'👩‍🏭👩‍🏭✊👩‍🏭'},
B12:{n:'1979년 10월, 부산 밤거리',g:'linear-gradient(#21263b,#c26a33 70%,#2a1c14)',e:'🔥✊🧑‍🎓✊🔥'},
B13:{n:'1979년 10월 27일 새벽, 작은 방',g:'linear-gradient(#151a24,#3b3226 70%,#14100b)',e:'📻📓🪟'},
B14:{n:'1980년 5월, 서울역 앞',g:'linear-gradient(#c9b48a,#9a8a6a 60%,#4a4034)',e:'🚉✊🧑‍🎓✊'},
B15:{n:'1980년 5월, 광주 금남로',g:'linear-gradient(#5d6470,#8a7d6a 60%,#3a3128)',e:'🏢🍙🕯️🏢'},
B18:{n:'1960년 3월 15일, 투표소',g:'linear-gradient(#b9a27a,#8a7050 60%,#3e3022)',e:'🗳️👮📋🗳️'},
B19:{n:'1960년 4월, 마산 거리',g:'linear-gradient(#6f7f8c,#a38c6a 60%,#3b3024)',e:'🌊✊💐✊'},
B20:{n:'1960년 4월 19일, 경무대로 향하는 길',g:'linear-gradient(#a7a39a,#7d6a52 60%,#352a1f)',e:'🧑‍🎓✊🇰🇷✊🧑‍🎓'},
B16:{n:'1987년 6월, 서울 도심',g:'linear-gradient(#e9c27a,#a98b5e 60%,#4a3a28)',e:'🏙️✊📣✊🏙️'}
};
const FACE={neutral:'🙂',smile:'😊',surprised:'😮',worried:'😟',angry:'😠',sad:'😢',determined:'😤',thinking:'🤔'};
const CHAR={
hg:{k:'hangyeol',n:'세마',c:'#2e3d55',a:'📝'},
yun:{k:'yun',n:'남궁 선배',c:'#6e4527',a:'👓'},
mi:{k:'miyoung',n:'유진',c:'#56633a',a:'🎵'},
sun:{k:'sunja',n:'정민',c:'#9e3b2b',a:'🧵'},
dong:{k:'dongsu',n:'승렬',c:'#7a5a1e',a:'🌾'},
cen:{k:'censor',n:'검열관',c:'#1e1e1e',a:'🖍️'}
};
const CARDS={
c40:['기록','3·15 부정 선거 (1960)','이승만 정부와 자유당이 공무원·경찰을 동원해 관권·금권 선거를 벌이고, 야당 유세 방해, 선거인 명부 조작, 3인조·9인조 공개 투표 등 대대적인 부정을 저지름. 총유권자보다 투표자가 많이 나와 투표용지를 불태우기도 함.','교과서 86쪽'],
c41:['구호','마산 학생들의 행진 (1960.4)','“학생에게 자유를 달라!”, “범인을 잡아 법률에 호소, 정당한 처벌을 하라!” — 김주열 학생의 죽음을 애도하며 행진한 학생들의 구호. 경찰은 공포탄과 소방차의 붉은 물감으로 막아섬.','『마산일보』 1960. 4. 14. · 교과서 86쪽'],
c42:['사료','진영숙 학생의 편지 (1960.4.19)','한성여중 학생 진영숙이 숨지기 4시간 전 어머니께 남긴 편지. “어머니, 데모에 나간 저를 책하지 마시옵소서.”','교과서 89쪽'],
c43:['통계','4·19 혁명 희생자 (1960)','희생자는 모두 186명. 일반인 96명과 함께 중학생 21명, 초등학생 6명도 목숨을 잃음. 4월 19일 하루에만 전국에서 100명이 넘게 숨짐.','교과서 87·89쪽'],
c44:['사료','대학교수단 시국 선언문 (요지, 1960.4.25)','학생 시위는 부정과 불의에 항거하는 정의감의 표현이며, 이를 공산당의 조종으로 보는 것은 고의의 왜곡이다. 3·15 선거는 부정 선거이니 다시 하라. 교수들은 “학생의 피에 보답하라.”라고 외치며 거리로 나섬.','『동아일보』 1960. 4. 26. · 교과서 87쪽'],
c45:['사료','이승만 대통령 사임 성명 (요지, 1960.4.26)','국민이 원한다면 대통령직을 사임하겠다. 3·15 선거에 많은 부정이 있었다 하니 선거를 다시 하도록 하였다. 이기붕에게 공직에서 완전히 물러나도록 하였다.','대통령 기록관 · 교과서 87쪽'],
c1:['조문','3차 개헌 (1960.6)','허정 과도 정부 때 개헌. 내각 책임제와 양원제(민의원·참의원) 국회가 주요 내용. 대통령은 국회에서 뽑고, 실권은 국무총리가 이끄는 내각이 가짐.','헌법 개정 요지 · 교과서 88쪽'],
c2:['통계','7·29 총선 결과 (1960)','야당이던 민주당이 압승(민의원 233석 중 175석). 대통령 윤보선, 국무총리 장면의 민주당 정부 수립.','선거 결과 · 교과서 88쪽'],
c3:['구호','4·19 이후 통일 운동 (1961)','“이 땅이 뉘 땅인데, 오도 가도 못하는가! 가자 북으로! 오라 남으로!” — 학생들은 판문점에서 남북 학생 회담을 열자고 제안.','통일 운동 구호 · 교과서 88쪽'],
c4:['사료','장면 내각의 시정 방침 (요약, 1960)','일본과 국교 정상화, 유엔 감시하 남북한 자유선거로 통일, 공무원 재산 등록·경찰 중립화, 부정 선거 원흉·부정 축재자 처벌, 외자 도입으로 경제 개발 계획 추진.','『동아일보』, 1960. 8. 28. · 교과서 88쪽'],
c5:['헤드라인','새벽일보 1960년 가을 (가상)','민주당 신·구파 파벌 싸움 격화… 부정 선거 책임자 처벌은 지지부진','가상의 신문 기사'],
c6:['기록','교원 노조 결성 (1960)','4·19 이후 학생·노동자·농민뿐 아니라 교원들도 노동조합을 만들며 목소리를 높임.','교과서 88쪽'],
c7:['사료','혁명 공약 (1961)','“1. 반공을 국시의 제일의로 삼는다. 4. 국가 자주 경제 재건에 총력을 기울인다. 6. 과업이 성취되면 양심적인 정치인들에게 정권을 이양한다.”','혁명 공약 · 교과서 90쪽'],
c8:['조문','5차 개헌 (1962)','대통령 중심제로 헌법 개정. 이어 민주 공화당 창당.','헌법 개정 요지 · 교과서 90쪽'],
c9:['통계','제5대 대통령 선거 (1963)','박정희는 군대로 복귀하겠다는 약속을 어기고 민간인 신분으로 출마. 민주 공화당 후보로 윤보선을 누르고 당선(약 15만 표 차).','선거 결과 · 교과서 90쪽'],
c10:['사료','김종필–오히라 비밀 회담 (1962)','중앙정보부장 김종필과 일본 외무상 오히라가 비밀리에 만나 국교 정상화 회담 진행. 식민 지배 사죄·배상, 약탈 문화유산 반환은 빠짐.','교과서 90쪽'],
c11:['구호','6·3 시위 (1964)','“제2의 한일 합방 결사 반대”, “굴욕적 대일 외교 반대” — 대학생·고등학생의 반대 시위에 시민이 동조. 정부는 비상계엄령을 선포하고 군대로 진압.','시위 구호 · 교과서 90쪽'],

c13:['조문','3선 개헌 — 6차 개헌 (1969)','대통령의 3회 연임 허용. 여당이 야당 의원들을 따돌리고 국회 별관에서 편법으로 통과.','교과서 91쪽'],
c14:['통계','제7대 대통령 선거 (1971)','개정된 헌법에 따라 치른 선거에서 박정희가 야당 후보 김대중을 힘겹게 누르고 당선(약 94만 표 차).','선거 결과 · 교과서 91쪽'],
c39:['기록','동백림 사건 (1967)','중앙정보부가 동베를린 거점 간첩단이라며 예술인·교수·학생을 연행. 재판에서 간첩 혐의는 입증되지 않음. 이후 조사에서 정부가 사건을 확대·과장한 것으로 밝혀짐.','교과서 91쪽'],
c17:['사료','7·4 남북 공동 성명 (1972)','닉슨 독트린 이후 냉전 완화 속에 남북이 대화에 나서 자주·평화·민족적 대단결의 통일 원칙에 합의.','교과서 92쪽'],
c18:['조문','유신 헌법 — 7차 개헌 (1972)','통일 주체 국민 회의에서 대통령 선출. 임기 6년, 중임 제한 없음. 대통령이 국회 의원 3분의 1 추천권·국회 해산권·법관 임명권·긴급 조치권을 가짐 → 삼권 분립 무력화.','교과서 92쪽'],
c37:['헤드라인','체육관 선거 (1972.12.23)','통일 주체 국민 회의 대의원들이 체육관에서 단독 후보에게 투표: 찬성 2,357표, 반대 0표, 무효 2표. 득표율 99.92%.','『매일경제』 보도 요지 · 교과서 92쪽'],
c26:['기록','개헌 청원 100만 인 서명 운동 (1973)','김대중 납치 사건을 계기로 유신 반대 운동이 활발해짐. 장준하 등 민주 인사들이 서명 운동을 전개하고, 학생들은 유신 헌법 철폐 시위를 이어 감.','교과서 92쪽'],
c19:['조문','긴급 조치 1호 (일부, 1974)','(유신) 헌법을 부정, 비방 및 개정, 폐지를 요구하는 행위를 금함. 이 조치를 위반하거나 비방한 자는 영장 없이 체포·수색하고 비상 군법 회의에서 심판.','교과서 92쪽'],
c20:['기록','제2차 인혁당 사건 (1974~1975)','중앙정보부가 학생 운동 배후에 인민 혁명당이 있다며 관련자를 체포. 8명에게 사형이 선고되고 곧바로 집행됨. 2007년 재심에서 무죄.','교과서 93쪽'],
c38:['사료','3·1 민주 구국 선언 (일부, 1976)','명동 성당에서 정치인·종교 인사들이 발표. 긴급 조치 철폐와 투옥된 민주 인사·학생 석방, 의회 정치 회복, 사법권 독립을 요구.','교과서 93쪽'],
c22:['통계','제10대 국회 의원 선거 (1978)','야당인 신민당의 득표율(32.8%)이 집권 여당 민주 공화당(31.7%)을 앞지름.','선거 결과 · 교과서 93쪽'],
c23:['기록','YH 무역 사건 (1979)','회사 측의 일방적 폐업에 항의해 신민당사에서 농성하던 노동자들을 경찰이 강경 진압. 그 과정에서 여성 노동자 한 명 사망.','교과서 93쪽'],
c24:['기록','김영삼 국회 의원 제명 (1979)','야당이 YH 무역 사건을 계기로 비판을 높이자, 여당이 신민당 총재 김영삼을 국회 의원에서 제명.','교과서 93쪽'],
c25:['사료','부마 민주 항쟁 (1979.10)','부산대에 뿌려진 「민주 투쟁 선언문」과 함께 ‘유신 철폐’, ‘독재 타도’ 시위 시작 → 시내로 확산, 시민 동참 → 부산 일대 계엄령 → 마산 공단 지역으로 확산.','교과서 93쪽'],
c27:['기록','12·12 사태 (1979)','전두환이 이끄는 일부 군인이 병력을 이끌고 반란을 일으켜 군사권 장악. 신군부 세력이 주요 정부 기관과 언론을 장악.','교과서 94쪽'],
c28:['기록','서울역 시위 (1980.5.15)','‘서울의 봄’의 절정. 10만여 명의 학생과 시민이 모여 비상계엄 해제와 신군부 퇴진을 요구.','교과서 94쪽'],
c29:['사료','『전남매일신문』 기자 일동 (1980.5.20)','“신문에는 단 한 줄도 싣지 못하였다. 이에 우리는 부끄러워 붓을 놓는다.” 검열로 진실을 보도하지 못한 기자들의 공동 사직.','교과서 94쪽'],
c30:['사료','광주 시민 궐기문 (요지, 1980.5.25)','계엄 당국이 공수 부대를 대량 투입해 무차별 살상을 저질러 총을 들 수밖에 없었으며, 협상이 올바로 진행되면 즉각 총을 놓겠다고 밝힘.','교과서 95쪽'],
c31:['기록','5·18의 법적 정당성과 기록','1997년 대법원은 광주 시민의 시위가 헌법 질서를 지키기 위한 정당한 행위였다고 밝힘. 2011년 관련 기록물이 유네스코 세계 기록 유산으로 등재.','교과서 96쪽'],
c36:['기록','전두환 정부의 성립 (1980~1981)','국가 보위 비상 대책 위원회 설치, 언론 통폐합, 삼청 교육대. 전두환이 통일 주체 국민 회의를 통해 대통령 취임 → 7년 단임 대통령 간선제 개헌 → 1981년 다시 당선.','교과서 97쪽'],
c32:['사료','보도 지침 (일부, 1986)','정부가 언론사에 보도 여부, 기사 제목, 용어, 분량까지 지시. 예: “검찰 발표 전문은 꼭 실어 줄 것.”','교과서 97쪽'],
c33:['사료','4·13 호헌 조치 (1987)','임기 중 개헌은 불가능하며 현행 헌법에 따라 후임자에게 정부를 넘기겠다고 밝히고, 대통령 직선제 개헌 논의 자체를 금지.','전두환 특별 담화 요지 · 교과서 97~98쪽'],
c34:['기록','박종철 고문치사 사건 (1987.1)','대학생 박종철이 수사 과정에서 고문으로 사망. 경찰이 이를 은폐·조작한 사실이 알려지며 국민의 분노 폭발.','교과서 97쪽'],
c35:['사료','6·29 선언 (일부, 1987)','여야 합의하에 조속히 대통령 직선제 개헌을 하고, 1988년 2월 평화적 정부 이양을 실현. 시국 관련 사범 석방.','민주 정의당 대표 노태우 · 교과서 98쪽']

/* ============ 소리: 웹 오디오로 직접 만드는 8비트 배경음악·효과음 (파일 없음) ============ */
const SND=(()=>{
 let ac=null,master,bgmG,sfxG,mode=LS.get('door1960_sound','all'),mood=null,timer=null,step=0,nextT=0;
 const hz=m=>440*Math.pow(2,(m-69)/12);
 function init(){
  if(ac)return true;
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return false;
  try{ac=new C();master=ac.createGain();master.gain.value=.5;master.connect(ac.destination);
   bgmG=ac.createGain();bgmG.gain.value=0;bgmG.connect(master);sfxG=ac.createGain();sfxG.gain.value=.55;sfxG.connect(master);}catch(e){ac=null;return false}
  return true;
 }
 function tone(dest,m,t,d,type,vol){
  const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=hz(m);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(dest);o.start(t);o.stop(t+d+.05);
 }
 function noise(dest,t,d,vol,freq){
  const n=Math.floor(ac.sampleRate*d),b=ac.createBuffer(1,n,ac.sampleRate),x=b.getChannelData(0);
  for(let i=0;i<n;i++)x[i]=(Math.random()*2-1)*(1-i/n);
  const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=b;f.type='lowpass';f.frequency.value=freq||2000;g.gain.value=vol;
  s.connect(f);f.connect(g);g.connect(dest);s.start(t);
 }
 /* 분위기별 곡: bpm, 멜로디(16분 단위 칸, null=쉼), 베이스, 북 */
 const _=null;
 const SONGS={
  hope:{bpm:96,lead:'square',vol:.05,mel:[72,_,76,_,79,_,76,_,74,_,77,_,81,_,77,_,76,_,79,_,84,_,79,_,77,_,76,_,74,_,_,_],bass:[48,_,_,_,55,_,_,_,57,_,_,_,53,_,_,_,48,_,_,_,55,_,_,_,53,_,_,_,55,_,_,_],drum:'k...h...k...h...'},
  news:{bpm:112,lead:'triangle',vol:.09,mel:[77,_,81,_,84,81,_,_,79,_,82,_,86,82,_,_,77,_,81,_,84,_,86,_,84,_,81,_,77,_,_,_],bass:[41,_,48,_,41,_,48,_,43,_,50,_,43,_,50,_,41,_,48,_,41,_,48,_,46,_,48,_,41,_,_,_],drum:'..h...h...h...h.'},
  tense:{bpm:70,lead:'triangle',vol:.08,mel:[69,_,_,_,_,_,72,_,_,_,71,_,_,_,_,_,69,_,_,_,_,_,64,_,_,_,65,_,_,_,64,_],bass:[45,_,_,_,45,_,_,_,45,_,_,_,44,_,_,_,45,_,_,_,45,_,_,_,41,_,_,_,40,_,_,_],drum:'k.......k.......'},
  march:{bpm:104,lead:'square',vol:.045,mel:[64,_,64,67,71,_,69,_,67,_,66,_,64,_,_,_,64,_,64,67,71,_,74,_,72,_,71,_,69,_,_,_],bass:[40,_,47,_,40,_,47,_,40,_,47,_,38,_,45,_,40,_,47,_,40,_,47,_,36,_,43,_,35,_,42,_],drum:'k.s.k.s.k.s.kss.'},
  sad:{bpm:60,lead:'triangle',vol:.08,mel:[74,_,_,_,72,_,_,_,69,_,_,_,_,_,_,_,70,_,_,_,69,_,_,_,65,_,_,_,_,_,_,_],bass:[38,_,_,_,_,_,_,_,34,_,_,_,_,_,_,_,36,_,_,_,_,_,_,_,33,_,_,_,_,_,_,_],drum:'................'}
 };
 const MOOD={B1:'hope',B2:'news',B3:'news',B4:'tense',B5:'march',B6:'sad',B7:'sad',B10:'tense',B11:'tense',B12:'march',B13:'sad',B14:'march',B15:'sad',B16:'hope',B18:'tense',B19:'march',B20:'march',END:'hope'};
 function tick(){
  if(!ac||!mood)return;if(mode!=='all'){nextT=ac.currentTime;return}const sg=SONGS[mood],sp=60/sg.bpm/4;
  while(nextT<ac.currentTime+.25){
   const i=step%32,m=sg.mel[i],b=sg.bass[i],d=sg.drum[i%16];
   if(m!=null)tone(bgmG,m,nextT,sp*2.2,sg.lead,sg.vol);
   if(b!=null)tone(bgmG,b,nextT,sp*3.5,'triangle',.12);
   if(d==='k'){tone(bgmG,36,nextT,.12,'sine',.25)}
   else if(d==='s'){noise(bgmG,nextT,.08,.06,3000)}
   else if(d==='h'){noise(bgmG,nextT,.03,.025,8000)}
   nextT+=sp;step++;
  }
 }
 function setMood(m){
  if(!m||m===mood)return;mood=m;if(!ac)return;
  step=0;nextT=ac.currentTime+.05;
  bgmG.gain.cancelScheduledValues(ac.currentTime);bgmG.gain.setValueAtTime(0,ac.currentTime);
  if(mode==='all')bgmG.gain.linearRampToValueAtTime(.9,ac.currentTime+1.2);
  if(!timer)timer=setInterval(tick,100);
 }
 function apply(){
  if(!ac)return;const t=ac.currentTime;
  bgmG.gain.cancelScheduledValues(t);bgmG.gain.setValueAtTime(mode==='all'&&mood?.9:0,t);
  sfxG.gain.setValueAtTime(mode==='off'?0:.55,t);
 }
 const FX={
  click:t=>tone(sfxG,84,t,.05,'square',.08),
  next:t=>{tone(sfxG,79,t,.04,'square',.05);noise(sfxG,t,.02,.04,6000)},
  card:t=>[72,76,79,84].forEach((m,i)=>tone(sfxG,m,t+i*.07,.18,'square',.09)),
  ok:t=>{tone(sfxG,76,t,.1,'square',.1);tone(sfxG,84,t+.09,.2,'square',.1)},
  no:t=>{tone(sfxG,45,t,.18,'sawtooth',.08);tone(sfxG,44,t+.12,.22,'sawtooth',.08)},
  close:t=>{noise(sfxG,t,.35,.35,400);tone(sfxG,33,t,.4,'sine',.4);tone(sfxG,52,t+.02,.25,'triangle',.08)},
  lock:t=>{noise(sfxG,t,.35,.35,400);tone(sfxG,33,t,.4,'sine',.4);noise(sfxG,t+.35,.06,.2,5000);tone(sfxG,88,t+.36,.08,'square',.06)},
  crack:t=>{noise(sfxG,t,.25,.3,1500);noise(sfxG,t+.15,.3,.2,800);[64,67,71,76].forEach((m,i)=>tone(sfxG,m,t+.45+i*.12,.5,'triangle',.08))},
  open:t=>[60,64,67,72,76,79,84].forEach((m,i)=>tone(sfxG,m,t+i*.08,.6,'triangle',.09)),
  good:t=>[72,76,79,84,79,84].forEach((m,i)=>tone(sfxG,m,t+i*.09,.2,'square',.08)),
  meh:t=>{tone(sfxG,72,t,.15,'square',.07);tone(sfxG,71,t+.15,.3,'square',.07)},
  fanfare:t=>[67,72,76,79,_,76,79,84].forEach((m,i)=>m!=null&&tone(sfxG,m,t+i*.11,.25,'square',.09))
 };
 function fx(name){if(mode==='off')return;if(!init())return;if(ac.state==='suspended')ac.resume();try{FX[name](ac.currentTime+.01)}catch(e){}}
 function unlock(){if(mode==='off')return;if(init()&&ac.state==='suspended')ac.resume();if(mood&&!timer){const m=mood;mood=null;setMood(m)}}
 function bg(id){const m=MOOD[id];if(!m)return;if(!ac){mood=m;return}setMood(m)}
 function cycle(){mode=mode==='all'?'sfx':mode==='sfx'?'off':'all';LS.set('door1960_sound',mode);init();if(ac&&ac.state==='suspended')ac.resume();
  if(mode==='all'&&mood&&!timer){const m=mood;mood=null;setMood(m)}apply();return mode}
 const label=()=>mode==='all'?'🔊 소리 켜짐':mode==='sfx'?'🔉 효과음만':'🔇 소리 꺼짐';
 return {fx,bg,unlock,cycle,label};
})();

function step(){return CH[S.ch].s[S.i]}
function next(){SND.fx('next');S.i++;save();run()}
function run(){
 hud();
 const st=step();if(!st)return;
 const k=st[0];
 if(k==='bg'){S.bg=st[1];S.i++;return run()}
 if(k==='card'){if(!S.cards.includes(st[1]))S.cards.push(st[1]);hud();renderStory(null);SND.fx('card');
  openOv(`<p class="h" style="font-size:22px;margin:0">🗂️ 사료 카드를 얻었다</p><div class="toastcard">${cardHTML(st[1])}</div><button class="btn pri" id="ovN">수첩에 붙이기</button>`);
  $('#ovN').onclick=()=>{closeOv();next()};return}
 if(k==='door'){const old=S.door;S.door=st[1];setTimeout(()=>SND.fx(S.door===0?'open':S.door===5?'crack':S.door===4?'lock':'close'),650);
  openOv(`<p class="h" style="font-size:24px;margin:0">${esc(st[2])}</p><div class="bigdoor" id="bd">${doorPic(old)}</div><button class="btn pri" id="ovN">계속</button>`);
  setTimeout(()=>{const bd=$('#bd');if(bd){bd.innerHTML=doorPic(S.door);bd.classList.add('slam')}hud()},700);
  $('#ovN').onclick=()=>{closeOv();next()};return}
 if(k==='mini'){return renderMini(st[1])}
 if(k==='article'){return renderArticle()}
 if(k==='column'){return renderColumn(st)}
 if(k==='end'){return renderEnd()}
 if(k==='ending'){return renderEnding()}
 renderStory(st);
}
function renderStory(st){

  dx.querySelectorAll('.opt').forEach(btn=>btn.onclick=()=>{

   let r=dx.querySelector('.reply');if(!r){r=document.createElement('div');r.className='reply';dx.appendChild(r)}
   r.textContent=k==='choice'?st[3]:'선택: '+a+' — 왜 그렇게 생각하는지 짝과 이야기해 보세요. 이 선택은 차시 마무리 기록에 함께 남습니다.';
   if(!row.innerHTML)addNext();

 const [who,face]=k.split(':');const c=CHAR[who];

 tx.className='txt';tx.textContent=st[1];addNext();

/* 여러 정책에 해당할 수 있는 카드 분류 (한일 협정 / 베트남 파병 / 둘 다 / 둘 다 아님) */
function renderMulti(m){
 const items=[];m.groups.forEach(([g,list])=>shuf(list).forEach(([t,ans])=>items.push({g,t,ans,pick:[]})));
 let checked=false;
 const same=(a,b)=>a.length===b.length&&a.every(x=>b.includes(x));
 const draw=()=>{
  let lastG='';
  main.innerHTML=`<div id="panel"><h2>${m.title}</h2><p class="lead">${m.lead}</p>
  <div class="mtab"><div class="mhead"><span></span>${m.cols.map(c=>`<b>${esc(c)}</b>`).join('')}</div>
  ${items.map((it,i)=>{const gh=it.g!==lastG?`<div class="mgroup">${esc(it.g)}</div>`:'';lastG=it.g;
   const ok=same(it.pick,it.ans);
   return gh+`<div class="mrow ${checked?(ok?'ok':'no'):''}"><span>${checked?(ok?'○ ':'× '):''}${esc(it.t)}${TEACHER?`<span class="ans">★ ${it.ans.length?it.ans.map(a=>m.cols[a].split(' ')[0]).join('·'):'해당 없음'}</span>`:''}</span>
   ${m.cols.map((c,j)=>`<button class="tog ${it.pick.includes(j)?'on':''}" data-i="${i}" data-j="${j}" aria-pressed="${it.pick.includes(j)}">${it.pick.includes(j)?'✔':''}<span class="sr">${esc(c)}</span></button>`).join('')}</div>`}).join('')}
  </div>
  <p class="note">아무 정책에도 해당하지 않는 카드는 비워 두세요.</p>
  <p class="msg" id="msg"></p><div style="display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap"><button class="btn" id="mC">확인하기</button><button class="btn pri hidden" id="mN">다음 ▶</button></div></div>`;
  main.querySelectorAll('.tog').forEach(b=>b.onclick=()=>{const it=items[+b.dataset.i],j=+b.dataset.j;it.pick=it.pick.includes(j)?it.pick.filter(x=>x!==j):it.pick.concat(j);checked=false;draw()});
  $('#mC').onclick=()=>{
   checked=true;const ok=items.filter(it=>same(it.pick,it.ans)).length;draw();
   const msg=$('#msg');
   if(ok===items.length){SND.fx('good');msg.className='msg ok';msg.innerHTML='모두 맞았어요!<div class="reply" style="font-weight:400">'+m.done+'</div>';$('#mN').classList.remove('hidden');$('#mN').onclick=next;$('#mN').focus()}
   else{miss();msg.className='msg no';msg.textContent=`${items.length}장 중 ${ok}장이 맞았어요. × 표시된 카드를 다시 살펴보세요. 두 정책에 모두 해당하는 카드도 있어요.`}
  };
 };
 draw();
}

function deskReply(ok,good,bad){
 const badT=bad.map(c=>`‘${CARDS[c][1]}’`).join(', ');
 if(ok&&good===2) return {h:'1면 게재!',t:'사실도 맞고 근거도 탄탄하다. 이 정도면 1면에 실어도 되겠어.'};
 if(ok&&good===1) return {h:'사회면 게재 — 근거 하나 보완 필요',t:`헤드라인은 정확해. 그런데 ${badT} 카드는 이 기사를 받쳐 주지 못해. 근거 하나만 바꾸면 1면이다.`};
 if(ok) return {h:'보류 — 근거를 다시 찾아 와',t:`제목은 맞았는데, 고른 근거 두 장이 모두 이 기사와 맞지 않아. 근거 없는 기사는 독자가 믿지 않는다.`};
 if(good===2) return {h:'데스크에서 반려 — 제목이 사실과 달라',t:'근거는 잘 골랐는데, 그 사료를 읽고 어떻게 이런 제목이 나오지? 사료를 다시 읽고 제목을 고쳐 와.'};
 if(good===1) return {h:'데스크에서 반려',t:`제목이 사실과 다르고, ${badT} 카드도 이 기사의 근거가 되지 못해. 처음부터 다시 확인하자.`};
 return {h:'데스크에서 반려',t:'제목도 사실과 다르고 근거도 맞지 않아. 취재 수첩부터 다시 펼쳐 봐.'};
}

function renderEnd(){
 save();
 const last=S.ch>=S.range[1];
 if(last&&S.lesson)return renderLessonEnd();
 main.innerHTML=`<div id="panel" style="text-align:center"><h2>챕터 ${S.ch+1} 끝 — ${CH[S.ch].t}</h2>
 <div class="bigdoor">${doorPic(S.door)}</div><p class="lead">문: ${DOORLBL[S.door]} · 이 챕터 기사 신뢰도 ${S.scores[S.ch]??'—'}</p>
 ${last?`${summaryHTML()}<button class="btn pri" id="eN">처음 화면으로</button>`:`<button class="btn pri" id="eN">챕터 ${S.ch+2}로 ▶</button>`}</div>`;
 $('#eN').onclick=()=>{if(last){title()}else{S.ch++;S.i=0;S.door=Math.max(S.door,CH[S.ch].door);save();main.innerHTML='';run()}};
}
function summaryHTML(){
 const avg=avgScore(),tot=rangeCards(S.range).length;
 const ttl=avg>=90?'시대를 기록한 기자':avg>=70?'믿을 만한 기자':avg>=50?'수습 딱지를 뗀 기자':'다시 취재가 필요한 기자';
 return `<div class="result"><div><b>${avg}</b>평균 신뢰도</div><div><b>${Math.round(S.cards.length/tot*100)}%</b>사료 수집률 (${S.cards.length}/${tot})</div><div><b>${S.miss}</b>미니게임 다시 생각한 횟수</div><div><b style="font-size:22px">${ttl}</b>칭호</div></div>`;
}
function renderEnding(){
 SND.bg('END');
 save();
 main.innerHTML=`<div id="panel">
 <div style="aspect-ratio:16/9;border:2px solid var(--ink);border-radius:4px;overflow:hidden;margin-bottom:12px;background:#2a2118">${pic('assets/ending.webp',`<span style="width:30%;height:90%;margin:auto">${doorSVG(0)}</span>`)}</div>
 <p class="endline">문이 다시 열렸다. 열린 문을 지키는 일은 이제 시민의 몫이었다.</p>
 <p style="text-align:center">1960년 4·19 혁명 → 1979년 부마 민주 항쟁 → 1980년 5·18 민주화 운동 → 1987년 6월 민주 항쟁. 문은 한 번도 저절로 열리지 않았다.</p>
 <div style="display:flex;justify-content:flex-end"><button class="btn pri" id="eN">마무리 글쓰기 ▶</button></div></div>`;
 $('#eN').onclick=()=>S.lesson?renderLessonEnd():title();
}
function lessonText(L,opinion,cards){
 const by=t=>S.log.filter(x=>x.type===t).map(x=>`[챕터${x.ch+1}] ${x.q} → ${x.a}`).join('\n');
 return {
  제출시각:new Date().toLocaleString('ko-KR'),학번:S.sid,이름:S.name,차시:`${L.n}차시`,
  질문:L.q,의견:opinion,근거카드:cards.map(c=>CARDS[c][1]).join(' / '),
  평균신뢰도:avgScore(),사료수집:`${S.cards.length}/${rangeCards(S.range).length}`,미니게임재시도:S.miss,
  생각기록:[by('생각해 보기'),by('평가')].filter(Boolean).join('\n'),기사기록:by('기사')
 };
}
function renderLessonEnd(){
 const L=CONFIG.lessons.find(l=>l.n===S.lesson);
 const mine=S.log.filter(x=>x.type!=='기사');
 main.innerHTML=`<div id="panel"><h2>${L.n}차시 마무리 — ${esc(L.t)}</h2>
 <div class="bigdoor" style="height:min(200px,50vw);width:min(160px,40vw)">${doorPic(S.door)}</div>
 ${summaryHTML()}
 ${mine.length?`<p class="h" style="font-size:19px;margin:6px 0">이번 차시에 내가 고른 생각</p><ul class="mylog">${mine.map(x=>`<li><span>${esc(x.q)}</span><b>${esc(x.a)}</b></li>`).join('')}</ul>`:''}
 <p class="h" style="font-size:22px;margin:18px 0 4px">✍️ 나의 생각 쓰기</p>
 <p class="qbox">${esc(L.q)}</p>
 ${S.log.filter(x=>x.type==='평가').map(x=>`<p class="note">📓 챕터 ${x.ch+1}에서 수첩에 쓴 나의 평가: ${esc(x.a)} — 선배의 반문도 떠올리며 써 보세요.</p>`).join('')}
 <p class="note">① 근거로 쓸 사료 카드 2장을 고르세요. <span id="fcn">(0/2)</span></p>
 <div class="cardgrid" id="fc">${S.cards.map(id=>cardHTML(id,'button')).join('')}</div>
 <p class="note" style="margin-top:12px">② 고른 카드를 근거로 들어 두세 문장 이상 써 보세요.</p>
 ${L.ex?exBox(L.ex,['<b style="font-family:inherit;font-size:inherit">근거 ①</b> — 첫 번째 카드에서 알 수 있는 사실','<b style="font-family:inherit;font-size:inherit">근거 ②</b> — 두 번째 카드에서 알 수 있는 사실','<b style="font-family:inherit;font-size:inherit">나의 생각</b> — 그래서 나는 …(이)라고 생각한다 (왜냐하면 …)']):''}
 <textarea id="fw" placeholder="「카드 이름」 카드를 보면 … . 「카드 이름」 카드에서는 … . 그래서 나는 …(이)라고 생각한다."></textarea>
 <p class="note"><span id="fwc">0</span>자 · ${esc(S.sid)} ${esc(S.name)}</p>
 <p class="msg" id="fmsg"></p>
 <div style="display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap"><button class="btn" id="fC">내 기록 복사</button><button class="btn pri" id="fS" disabled>제출하고 마치기</button></div></div>`;
 let fc=[];
 const fw=$('#fw');
 const chk=()=>{$('#fwc').textContent=fw.value.trim().length;$('#fS').disabled=!(fc.length===2&&fw.value.trim().length>=20)};
 main.querySelectorAll('#fc .card').forEach(b=>b.onclick=()=>{const id=b.dataset.id;if(fc.includes(id))fc=fc.filter(x=>x!==id);else if(fc.length<2)fc.push(id);
  main.querySelectorAll('#fc .card').forEach(x=>x.classList.toggle('sel',fc.includes(x.dataset.id)));$('#fcn').textContent=`(${fc.length}/2)`;chk()});
 fw.oninput=chk;
 const asText=p=>Object.entries(p).map(([k,v])=>`${k}: ${v}`).join('\n');
 $('#fC').onclick=async()=>{const t=asText(lessonText(L,fw.value.trim(),fc));
  try{await navigator.clipboard.writeText(t);$('#fmsg').className='msg ok';$('#fmsg').textContent='복사했어요.'}
  catch(e){openOv(`<p class="h" style="font-size:20px;margin:0 0 8px">아래 내용을 길게 눌러 복사하세요</p><textarea readonly style="min-height:240px">${esc(t)}</textarea><div style="margin-top:10px"><button class="btn pri" id="ovX">닫기</button></div>`,true);$('#ovX').onclick=closeOv}};
 $('#fS').onclick=async()=>{
  const p=lessonText(L,fw.value.trim(),fc);
  const box=LS.get('door1960_sent',[]);box.push(p);LS.set('door1960_sent',box);
  const fin=(ok,msg)=>{markDone(L.n);LS.set('door1960',null);
   main.innerHTML=`<div id="panel" style="text-align:center"><h2>${L.n}차시 끝!</h2><p class="endline">${ok?'기록이 제출되었어요.':'기록을 저장했어요.'}</p><p>${msg}</p>
   ${L.n<CONFIG.lessons.length?`<p class="lead">다음 시간에는 표지에서 <b>${L.n+1}차시</b>를 눌러 이어 가세요.</p>`:'<p class="lead">모든 차시를 마쳤어요. 수고했어요!</p>'}
   <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn" id="fC2">내 기록 복사</button><button class="btn pri" id="fH">처음 화면으로</button></div></div>`;
   $('#fH').onclick=title;$('#fC2').onclick=async()=>{try{await navigator.clipboard.writeText(asText(p))}catch(e){}}};
  if(!CONFIG.submitUrl){fin(false,'제출 주소가 아직 연결되지 않았어요. ‘내 기록 복사’를 눌러 선생님이 안내한 곳에 붙여 넣으세요.');return}
  $('#fS').disabled=true;$('#fmsg').className='msg';$('#fmsg').textContent='제출하는 중…';
  try{await fetch(CONFIG.submitUrl,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)});SND.fx('fanfare');fin(true,'선생님의 기록부에 저장되었어요.')}
  catch(e){$('#fS').disabled=false;$('#fmsg').className='msg no';$('#fmsg').textContent='제출에 실패했어요. 인터넷 연결을 확인하고 다시 눌러 주세요. 계속 안 되면 ‘내 기록 복사’를 이용하세요.'}
 };
}

/* ============ 표지 ============ */
function start(range,lesson){
 const sid=S.sid,name=S.name;
 Object.assign(S,{ch:range[0],i:0,range,lesson:lesson||0,door:CH[range[0]].door,cards:[],scores:{},log:[],miss:0,artTry:{},bg:'B1',sid,name});
 save();main.innerHTML='';run();
 if(lesson)openDoorInfo(true);
}
function title(){
 closeOv();$('#hud').classList.add('hidden');
 const sv=load();const dm=doneMap();
 main.innerHTML=`<div class="cover"><div class="art">${pic('assets/title.webp',`<span style="width:min(220px,40%);height:90%">${doorSVG(1)}</span>`)}</div>
 <div class="ttl"><h1 id="tH">닫히는 문</h1><p>1960~1987 · 4·19로 열린 민주주의의 문은 어떻게 닫혔고, 다시 열리기까지 무엇이 필요했을까?</p>
 <p class="note">주인공 세마와 조연(${CHAR.yun.n}·유진·정민·승렬)은 가상 인물입니다. 역사적 사건과 결과는 사실 그대로이며, 미래엔 한국사2 교과서 86~99쪽 내용을 따릅니다.</p>
 <div class="field"><input id="iSid" inputmode="numeric" placeholder="학번 (예: 10501)" value="${esc(S.sid)}" aria-label="학번"><input id="iName" placeholder="이름" value="${esc(S.name)}" aria-label="이름"></div>
 <p class="msg no" id="tMsg"></p>
 <div style="margin:0 0 8px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" id="tDoor">🚪 ‘닫히는 문’이란?</button><button class="btn sm" id="tSnd" aria-label="소리 설정 바꾸기">${SND.label()}</button></div>
 ${sv&&sv.lesson&&sv.sid?`<div style="margin-bottom:8px"><button class="btn" id="tC">이어하기 — ${esc(sv.sid)} ${esc(sv.name)} · ${sv.lesson}차시 챕터 ${sv.ch+1}</button></div>`:''}
 <p class="h" style="font-size:20px;margin:14px 0 0">차시를 골라 시작하세요</p>
 <div class="chs">${CONFIG.lessons.map(l=>{const d=dm[S.sid]&&dm[S.sid][l.n];return `<button class="ch" data-l="${l.n}"><b>${l.n}차시 · 챕터 ${l.r[0]+1}${l.r[1]>l.r[0]?'~'+(l.r[1]+1):''}${d?' <span class="done">✓ 완료</span>':''}</b><span>${esc(l.t)}</span></button>`}).join('')}</div>
 ${TEACHER?`<div class="tpanel"><p class="h" style="font-size:20px;margin:0">교사 모드 (정답 ★ 표시 · 활동 건너뛰기)</p>
 <div class="chs">${CH.map((c,i)=>`<button class="ch" data-r="${i}"><b>${i+1}. ${c.t}</b><span>${c.y}</span></button>`).join('')}</div>
 <div style="margin-top:10px"><button class="btn sm" id="tOff">교사 모드 끄기</button></div></div>`:''}
 </div></div>`;
 const grab=()=>{S.sid=$('#iSid').value.trim();S.name=$('#iName').value.trim();
  if(!/^\d{4,6}$/.test(S.sid)||!S.name){$('#tMsg').textContent='학번(숫자)과 이름을 먼저 입력하세요.';(!S.sid?$('#iSid'):$('#iName')).focus();return false}LS.set('door1960_me',{sid:S.sid,name:S.name});return true};
 main.querySelectorAll('.ch[data-l]').forEach(b=>b.onclick=()=>{if(!grab())return;const l=CONFIG.lessons.find(x=>x.n===+b.dataset.l);start(l.r,l.n)});
 main.querySelectorAll('.ch[data-r]').forEach(b=>b.onclick=()=>{S.sid=S.sid||'00000';S.name=S.name||'교사';start([+b.dataset.r,+b.dataset.r],0)});
 const tc=$('#tC');if(tc)tc.onclick=()=>{Object.assign(S,sv);main.innerHTML='';run()};
 $('#tDoor').onclick=()=>openDoorInfo(false);
 $('#tSnd').onclick=()=>{SND.cycle();$('#tSnd').textContent=SND.label();$('#bSnd').textContent=SND.label()};
 const to=$('#tOff');if(to)to.onclick=()=>{TEACHER=false;title()};
 // 교사 모드: 제목을 3초 안에 5번 누르면 비밀번호 입력
 let taps=[];$('#tH').onclick=()=>{const n=Date.now();taps=taps.filter(t=>n-t<3000).concat(n);if(taps.length>=5){taps=[];
  openOv(`<p class="h" style="font-size:22px;margin:0 0 8px">교사 확인</p><div class="field"><input id="pin" type="password" inputmode="numeric" placeholder="비밀번호" aria-label="비밀번호"></div><p class="msg no" id="pinMsg"></p><button class="btn pri" id="pinOk">확인</button> <button class="btn" id="ovX">취소</button>`);
  $('#ovX').onclick=closeOv;
  const ok=()=>{if($('#pin').value===CONFIG.teacherPin){TEACHER=true;closeOv();title()}else $('#pinMsg').textContent='비밀번호가 다릅니다.'};
  $('#pinOk').onclick=ok;$('#pin').onkeydown=e=>{if(e.key==='Enter')ok()}}};
}

/* ============ 공통 버튼 ============ */
$('#bArchive').onclick=()=>{
 const all=rangeCards(S.range);
 openOv(`<h2 class="h" style="font-size:28px;margin:0 0 4px">🗂️ 사료함</h2><p class="note">이번 차시에 모은 카드 ${S.cards.length}/${all.length}장 · 아직 못 모은 카드는 흐리게 보여요.</p>
 <div class="cardgrid">${all.map(id=>S.cards.includes(id)?cardHTML(id):`<div class="card locked"><span class="ty 기록">?</span><b>아직 모으지 못한 사료</b></div>`).join('')}</div>
 <div style="text-align:right;margin-top:12px"><button class="btn pri" id="ovX">닫기</button></div>`,true);
 $('#ovX').onclick=closeOv;
};
$('#bHome').onclick=()=>{save();title()};
{const sb=$('#bSnd');sb.textContent=SND.label();sb.onclick=()=>{SND.cycle();sb.textContent=SND.label();const t=$('#tSnd');if(t)t.textContent=SND.label()}}
$('#doorMini').onclick=()=>openDoorInfo(false);
$('#bSkip').onclick=()=>{
 const s=CH[S.ch].s;let j=S.i+1;
 while(j<s.length&&!['mini','article','end','ending','door'].includes(s[j][0])){if(s[j][0]==='card'&&!S.cards.includes(s[j][1]))S.cards.push(s[j][1]);if(s[j][0]==='bg')S.bg=s[j][1];j++}
 closeOv();S.i=Math.min(j,s.length-1);main.innerHTML='';run();
};
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&ov.classList.contains('on')){const x=$('#ovX');if(x)closeOv();return}
 if((e.key==='Enter'||e.key===' ')&&!['TEXTAREA','INPUT','SELECT','BUTTON'].includes(document.activeElement.tagName)){
  const b=ov.classList.contains('on')?$('#ovN'):$('#bNext');if(b){e.preventDefault();b.click()}}
});
{const me=LS.get('door1960_me',null);if(me){S.sid=me.sid||'';S.name=me.name||''}}
title();
}
</script>
</body>
</html>
