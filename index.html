<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한국사 수업 게임</title>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#d9ccb0;--paper:#f1e7d0;--ink:#2b231b;--muted:#6b5c49;--brick:#9e3b2b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 "Noto Sans KR",sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:40px 20px}
h1{font-family:"Do Hyeon";font-weight:400;font-size:clamp(36px,6vw,56px);line-height:1.1;margin:0 0 6px}
p.lead{color:var(--muted);margin:0 0 28px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px}
a.game{display:block;background:var(--paper);border:3px solid var(--ink);border-radius:6px;overflow:hidden;color:inherit;text-decoration:none;box-shadow:5px 5px 0 var(--ink);transition:transform .15s}
a.game:hover{transform:translate(-2px,-2px)}
a.game .pic{aspect-ratio:16/9;background:#3a2e22 center/cover no-repeat}
a.game .t{padding:14px 18px 18px}
a.game b{font-family:"Do Hyeon";font-weight:400;font-size:26px;display:block;line-height:1.2}
a.game span{color:var(--muted);font-size:15px}
footer{margin-top:36px;color:var(--muted);font-size:13px}
@media(prefers-reduced-motion:reduce){a.game{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <h1>한국사 수업 게임</h1>
  <p class="lead">수업 시간에 선생님이 안내한 게임을 골라 들어가세요.</p>
  <div class="grid">
    <a class="game" href="closing-door/">
      <div class="pic" style="background-image:url('closing-door/assets/title.webp')"></div>
      <div class="t"><b>닫히는 문 — 1960~1987</b><span>4·19 혁명부터 6월 민주 항쟁까지 · 기자 세마의 취재 수첩</span></div>
    </a>
    <a class="game" href="jongno1923/">
      <div class="pic" style="background-image:url('jongno1923/img/map.webp')"></div>
      <div class="t"><b>1923 종로 장날</b><span>물산 장려 운동과 민립 대학 설립 운동 · 장터 사람들의 이야기</span></div>
    </a>
  </div>
  <footer>한국사 수업용 · 등장인물은 가상 인물이며 역사적 사건과 결과는 사실을 따릅니다.</footer>
</div>
</body>
</html>
